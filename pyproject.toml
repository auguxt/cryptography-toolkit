[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptography-toolkit"
version = "1.0.0"
description = "A modern Python toolkit for learning classical and modern cryptography."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "auguxt" }
]

keywords = [
    "cryptography",
    "encryption",
    "cybersecurity",
    "python",
    "rsa",
    "xor",
    "caesar-cipher",
    "security",
    "education"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Topic :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "cryptography>=45.0.0,<46.0.0",
]

[project.urls]
Homepage = "https://github.com/auguxt/cryptography-toolkit"
Repository = "https://github.com/auguxt/cryptography-toolkit"
Issues = "https://github.com/auguxt/cryptography-toolkit/issues"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
